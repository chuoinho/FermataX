name: SmartTop CI Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source and PR base history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run Mobile unit suite
        id: mobile
        continue-on-error: true
        run: >-
          ./gradlew testMobileDebugUnitTest :whisper:testMobileDebugUnitTest
          --no-daemon --no-parallel --stacktrace

      - name: Upload Mobile test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smarttop-mobile-test-results
          if-no-files-found: warn
          path: |
            **/build/test-results/testMobileDebugUnitTest/**
            **/build/reports/tests/testMobileDebugUnitTest/**

      - name: Fail when Mobile suite failed
        if: steps.mobile.outcome == 'failure'
        run: exit 1
