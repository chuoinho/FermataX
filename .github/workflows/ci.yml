name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep the module graph identical to build.sh, which always builds without
  # optional Google-services features.
  NO_GS: true
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  hygiene:
    name: Source hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate build.sh syntax
        run: sh -n build.sh

      - name: Check whitespace in the PR/push diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="${PUSH_BASE_SHA:-}"
            if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ] \
                || ! git cat-file -e "$base_sha^{commit}" 2>/dev/null; then
              base_sha="$(git rev-parse HEAD^)"
            fi
          fi
          git diff --check "$base_sha...HEAD"

  unit-tests:
    name: Unit tests (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [Mobile, Auto]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build

      - name: Verify Web-only production graph
        if: ${{ matrix.variant == 'Mobile' }}
        run: ./gradlew verifyWebOnlyProductionGraph --stacktrace

      # Includes the architecture/UI-shell guard tests in :fermata.
      - name: Run unit tests
        run: ./gradlew test${{ matrix.variant }}DebugUnitTest --continue --stacktrace

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.variant }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  lint:
    name: Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build

      - name: Lint
        run: ./gradlew :fermata:lintMobileDebug :fermata:lintAutoDebug --continue --stacktrace

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.*'
          if-no-files-found: ignore
          retention-days: 7

  # NON-NEGOTIABLE DISTRIBUTION CONTRACT:
  # FermataX ships exactly ONE universal APK used on both phone and Android Auto/DHU.
  # Mobile/Auto are internal source sets/test targets only and must never become separate
  # user-facing APKs, releases, or CI artifacts.
  package:
    name: Package universal APK
    needs: [hygiene, unit-tests, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-build

      # AGP uses the pinned NDK to strip prebuilt native libraries (e.g. VLC) when packaging.
      - name: Install NDK
        run: sdkmanager "ndk;$(sed -n 's/^ndkVersion = "\(.*\)"/\1/p' gradle/libs.versions.toml)"

      - name: Build single FermataX universal APK
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh -d
          mapfile -t apks < <(find dist -maxdepth 1 -type f -name 'FermataX-*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one universal APK, found ${#apks[@]}"
            exit 1
          fi
          cp "${apks[0]}" dist/FermataX-debug-universal.apk

      - name: Upload single FermataX universal APK
        uses: actions/upload-artifact@v4
        with:
          name: FermataX-device-test-${{ github.sha }}
          path: dist/FermataX-debug-universal.apk
          if-no-files-found: error
          retention-days: 7
