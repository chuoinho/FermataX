name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Mobile, Auto, lint, hotspot, and whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out source and PR base history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;29.0.14206865

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify Java and Gradle toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Mobile unit suite
        run: >-
          ./gradlew testMobileDebugUnitTest :whisper:testMobileDebugUnitTest
          --no-daemon --no-parallel --stacktrace

      - name: Auto unit suite
        if: ${{ !cancelled() }}
        run: ./gradlew testAutoDebugUnitTest --no-daemon --no-parallel --stacktrace

      - name: Web addon UI shell guard
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew :fermata:testMobileDebugUnitTest
          --tests me.aap.fermata.architecture.ArchitectureBoundaryTest.webAddonUsesCommonUiShellAuthorities
          --no-daemon --no-parallel --stacktrace

      - name: TV addon UI shell guard
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew :fermata:testMobileDebugUnitTest
          --tests me.aap.fermata.architecture.ArchitectureBoundaryTest.tvAddonUsesCommonUiShellAuthorities
          --no-daemon --no-parallel --stacktrace

      - name: UI shell single-writer guard
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew :fermata:testMobileDebugUnitTest
          --tests me.aap.fermata.architecture.UiShellArchitectureGuardTest
          --no-daemon --no-parallel --stacktrace

      - name: Architecture boundary guards
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew :fermata:testMobileDebugUnitTest
          --tests me.aap.fermata.architecture.ArchitectureBoundaryTest.hotspotClassesCannotGrowPastTheRecordedBaseline
          --tests me.aap.fermata.architecture.ArchitectureBoundaryTest.coreDoesNotImportConcreteAddonImplementations
          --tests me.aap.fermata.architecture.ArchitectureBoundaryTest.coreUiDoesNotReferenceConcreteAddonFragmentTypes
          --tests me.aap.fermata.architecture.ArchitectureBoundaryTest.addonModulesDoNotImportSiblingImplementations
          --no-daemon --no-parallel --stacktrace

      - name: Lint
        if: ${{ !cancelled() }}
        run: >-
          ./gradlew :fermata:lintMobileDebug :fermata:lintAutoDebug
          --no-daemon --no-parallel --stacktrace

      - name: Check whitespace in the PR/push diff
        if: ${{ !cancelled() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$PUSH_BASE_SHA"
            if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
              base_sha="$(git rev-parse HEAD^)"
            fi
          fi
          git cat-file -e "$base_sha^{commit}"
          git diff --check "$base_sha...HEAD"

      # Distribution contract: FermataX ships exactly one universal APK for phone + Android Auto.
      # Mobile/Auto source sets are tested above, but they are never separate distributed products.
      - name: Package single FermataX universal APK
        if: ${{ success() }}
        run: |
          ./gradlew :fermata:packageAutoDebugUniversalApk --no-daemon --no-parallel --stacktrace
          mkdir -p dist
          apk="$(find fermata/build/outputs/apk_from_bundle/autoDebug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" dist/FermataX-debug-universal.apk

      - name: Upload single FermataX universal APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: FermataX-device-test-${{ github.sha }}
          path: dist/FermataX-debug-universal.apk
          if-no-files-found: error
          retention-days: 7
