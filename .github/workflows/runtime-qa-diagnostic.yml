name: Capture runtime QA failure
on:
  push:
    branches: [agent/runtime-qa-fix-builder]
permissions:
  contents: write
jobs:
  capture:
    if: github.event.head_commit.message != 'Record runtime QA failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Capture failing guard
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :fermata:testMobileDebugUnitTest --tests me.aap.fermata.architecture.ArchitectureBoundaryTest.webAddonUsesCommonUiShellAuthorities --no-daemon --no-parallel --stacktrace > diagnostic.log 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> diagnostic.log
          set -e
      - name: Save diagnostic and remove workflow
        shell: bash
        run: |
          rm .github/workflows/runtime-qa-diagnostic.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostic.log .github/workflows/runtime-qa-diagnostic.yml
          git commit -m 'Record runtime QA failure'
          git push origin HEAD:agent/runtime-qa-fix-builder
