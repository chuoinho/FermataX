def configuredCoreDir = providers.gradleProperty('stremioCoreDir')
        .orElse(providers.environmentVariable('STREMIO_CORE_DIR'))
        .getOrElse(rootProject.file('stremio-core-java').absolutePath)
def coreDir = file(configuredCoreDir)
def generatedCoreDir = layout.buildDirectory.dir('generated/sources/stremioCore/main/java')
def jdkAdapterPaths = [
        'com/stremio/core/runtime/JdkEnv.java',
        'com/stremio/core/runtime/JdkHttpFetcher.java',
        'com/stremio/core/runtime/JdkHttpRequests.java',
        'com/stremio/core/transport/JdkAddonJsonClient.java'
]
def coreSourceTrees = [
        fileTree(new File(coreDir, 'stremio-core/src/main/java')) {
            exclude jdkAdapterPaths
        },
        fileTree(new File(coreDir, 'stremio-watched-bitfield/src/main/java'))
]
def syncCoreProbeSources = tasks.register('syncCoreProbeSources', Sync) {
    from coreSourceTrees
    into generatedCoreDir
    doFirst {
        int sourceCount = coreSourceTrees.sum { it.files.size() } as int
        if (sourceCount < 300) {
            throw new GradleException(
                    "Core probe source tree is missing or incomplete: ${sourceCount} Java files")
        }
    }
}

android {
    namespace = 'me.aap.fermata.coreprobe'

    // F-2 and the final gate use FermataX's production desugaring setup while
    // lint scans the complete platform-neutral stremio-core source set.
    compileOptions {
        coreLibraryDesugaringEnabled = true
    }

    sourceSets {
        main {
            java.srcDir generatedCoreDir.get().asFile
        }
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

tasks.named('preBuild') {
    dependsOn syncCoreProbeSources
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'
}
