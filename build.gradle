ext {
    VERSION_CODE = libs.versions.appVersionCode.get().toInteger()
    VERSION_NAME = libs.versions.appVersionName.get()
    SDK_MIN_VERSION = libs.versions.sdkMin.get().toInteger()
    SDK_TARGET_VERSION = libs.versions.sdkTarget.get().toInteger()
    SDK_COMPILE_VERSION = libs.versions.sdkCompile.get().toInteger()
    localProps = gradle.ext.localProps

    ANDROID_MATERIAL_VERSION = libs.versions.androidMaterial.get()
    ANDROID_PLAY_CORE_FD_VERSION = libs.versions.googlePlayFeatureDelivery.get()
    ANDROIDX_CORE_VERSION = libs.versions.androidxCore.get()
    ANDROIDX_ANNOTATION_VERSION = libs.versions.androidxAnnotation.get()
    ANDROIDX_MEDIA_VERSION = libs.versions.androidxMedia.get()
    ANDROIDX_APPCOMPAT_VERSION = libs.versions.androidxAppcompat.get()
    ANDROIDX_CONSTRAINTLAYOUT_VERSION = libs.versions.androidxConstraintlayout.get()
    ANDROIDX_SWIPEREFRESHLAYOUT_VERSION = libs.versions.androidxSwiperefreshlayout.get()
    GUAVA_VERSION = libs.versions.guava.get()

    addons = [
            [
                    name       : 'translate',
                    id         : 'translate_addon',
                    icon       : 'translate',
                    class      : 'me.aap.fermata.addon.TranslateAddon',
                    hasSettings: false
            ],
            [
                    name       : 'subgen',
                    id         : 'subgen_addon',
                    icon       : 'subgen',
                    class      : 'me.aap.fermata.addon.SubGenAddon',
                    depends    : 'exoplayer,translate',
                    hasSettings: false
            ],
    ]
}

buildscript {

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${libs.versions.agp.get()}"
        classpath "com.google.gms:google-services:${libs.versions.googleServices.get()}"
    }
}

allprojects {
	repositories {
		google()
		mavenCentral()
		gradlePluginPortal()
	}
}

subprojects {
    def isDynFeature = false

    if ('fermata'.equals(name)) {
        apply plugin: 'com.android.application'
    } else if (gradle.ext.modules.contains(':' + name)) {
        isDynFeature = true
        apply plugin: 'com.android.dynamic-feature'
    } else {
        apply plugin: 'com.android.library'
    }

    android {
        compileSdk SDK_COMPILE_VERSION
        ndkVersion = libs.versions.ndkVersion.get()

        defaultConfig {
            minSdkVersion SDK_MIN_VERSION
            targetSdkVersion SDK_TARGET_VERSION
            vectorDrawables.useSupportLibrary = true
            testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
            resConfigs 'en', 'ru', 'it', 'tr', 'de', 'pt', 'vi', 'pl', 'hr', 'ja', 'zh_TW', 'ko',
                    'fr', 'ro', 'ar', 'es', 'km'
        }

        if (isDynFeature) {
            flavorDimensions "version"

            productFlavors {
                mobile {
                    dimension "version"
                }
                auto {
                    dimension "version"
                    applicationIdSuffix '.auto' + project.getProperties().getOrDefault('APP_ID_SFX', '')
                }
            }
        }

        buildFeatures {
            buildConfig = true
            resValues = true
        }

        compileOptions {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
            coreLibraryDesugaringEnabled = true
        }

        testOptions {
            unitTests.returnDefaultValues = true
        }

        // AGP 9.2.1's inferred-thread dataflow can enter a non-terminating
        // least-fixpoint/hashCode walk on this multi-feature graph. Keep lint's
        // other checks enabled while disabling only the pathological detector.
        lint {
            disable += ['ThreadConstraint']
        }

        dependencies {
            coreLibraryDesugaring libs.desugarJdkLibs
        }
    }

    dependencies {
        testImplementation libs.junit4
        androidTestImplementation libs.androidxTestJunit
        androidTestImplementation libs.androidxTestEspresso
    }

    configurations.configureEach {
        resolutionStrategy {
            preferProjectModules()
            eachDependency { details ->
                if (details.requested.group == 'com.google.guava' && details.requested.name == 'guava') {
                    details.useVersion GUAVA_VERSION
                }
            }
        }
    }
}

gradle.projectsEvaluated {
    def addons = new ArrayList<HashMap>(ext.addons)
    gradle.ext.modules.forEach {
        def p = project(it)
        if (p.ext.has('addons')) {
            p.ext.addons.forEach {
                def info = new HashMap(it)
                info['module'] = p.name
                addons.add(info)
            }
        }
    }

    def addonInfo = new StringBuilder(1024)
    addonInfo.append('me.aap.utils.collection.CollectionUtils.sort(new me.aap.fermata.addon.AddonInfo[] {\n')
    addons.forEach {
        def name = it['name']
        def id = it.containsKey('id') ? "R.id.${it['id']}" : "0"
		def capabilities = it.get('capabilities',
				it.get('fragment', false) ? 'dashboard,navigation' : '')
		addonInfo.append("  new me.aap.fermata.addon.AddonInfo(" +
                "\"${it.get('module', name)}\", \"${it['class']}\", " +
                "${id}, " +
                "R.string.addon_name_${name}, R.drawable.${it['icon']}, " +
                "${it['order']}, ${it['hasSettings']}, ${it.get('fragment', false)}, ${it['enabled']}, " +
                "${it.get('auto', false)}, \"${it.get('depends', "")}\", " +
				"\"${capabilities}\", \"${it.get('voiceTarget', '')}\", " +
				"\"${it.get('resolverSchemes', '')}\"),\n")
    }

    def infoStr = addonInfo.append('})').toString()
    project(':fermata').android.productFlavors.forEach {
        it.buildConfigField 'me.aap.fermata.addon.AddonInfo[]', 'ADDONS', infoStr
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

tasks.register('verifyWebOnlyProductionGraph') {
    group = 'verification'
    description = 'Verifies the Web-only Stremio graph contains no retired native feature or libtorrent dependency.'

    doLast {
        def violations = []
        def retiredModules = gradle.ext.retiredProductionModules as Set
        def configuredModules = gradle.ext.modules as Set

        if (!configuredModules.contains(':web')) {
            violations.add('The Web add-on is missing from the production graph.')
        }
        if (!file('modules/web/src/main/java/me/aap/fermata/addon/web/stremio/StremioWebAddon.java').isFile()) {
            violations.add('The Web-only Stremio add-on source is missing.')
        }
        retiredModules.each { module ->
            if (configuredModules.contains(module) || findProject(module) != null) {
                violations.add("Retired native module ${module} is included in the production graph.")
            }
        }
        if (file('modules/stremio').exists()) {
            violations.add('Retired native modules/stremio is present in the source tree.')
        }

        def forbiddenDependency = { dependency ->
            def coordinate = "${dependency.group ?: ''}:${dependency.name ?: ''}:${dependency.version ?: ''}"
                    .toLowerCase(java.util.Locale.ROOT)
            coordinate.contains('jlibtorrent') || coordinate.contains('libtorrent')
        }
        allprojects.each { project ->
            project.configurations.each { configuration ->
                configuration.allDependencies.findAll(forbiddenDependency).each { dependency ->
                    violations.add("Forbidden declared dependency in ${project.path}:${configuration.name}: ${dependency.group}:${dependency.name}")
                }
            }
        }

        def productionConfigurations = [
                'mobileDebugRuntimeClasspath', 'mobileReleaseRuntimeClasspath',
                'autoDebugRuntimeClasspath', 'autoReleaseRuntimeClasspath'
        ] as Set
        ([project(':fermata')] + gradle.ext.modules.collect { project(it) }).each { project ->
            project.configurations.findAll {
                it.canBeResolved && productionConfigurations.contains(it.name)
            }.each { configuration ->
                configuration.incoming.resolutionResult.allComponents.each { component ->
                    def module = component.moduleVersion
                    if (module != null && forbiddenDependency(module)) {
                        violations.add("Forbidden resolved dependency in ${project.path}:${configuration.name}: ${module.group}:${module.name}:${module.version}")
                    }
                }
            }
        }

        if (!violations.isEmpty()) {
            throw new GradleException('Web-only production graph verification failed:\n - ' + violations.join('\n - '))
        }
    }
}

if (file('build-custom.gradle').exists()) {
    apply from: 'build-custom.gradle'
}
